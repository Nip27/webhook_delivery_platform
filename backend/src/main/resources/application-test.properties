spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
jwt.secret=test-secret-must-be-at-least-256-bits-for-hs256-algorithm-padded
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000
delivery.max-retries=3
delivery.http-timeout-ms=2000
delivery.worker-poll-interval-ms=1000
delivery.workers.enabled=false
