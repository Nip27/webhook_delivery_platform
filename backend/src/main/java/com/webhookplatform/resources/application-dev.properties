spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/webhookplatform}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# # DEV Only - weak secret intentional. Production MUST use a real 256-bit secret
# # Generate with: openssl rand -hex 32
jwt.secret=${JWT_SECRET:dev-secret-min-256-bits-change-in-production-now-x}
jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY_MS:900000}
jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}
delivery.max-retries=${DELIVERY_MAX_RETRIES:5}
delivery.http-timeout-ms=${DELIVERY_HTTP_TIMEOUT_MS:5000}
delivery.worker-poll-interval-ms=${DELIVERY_WORKER_POLL_MS:1000}
logging.level.com.webhookplatform=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
